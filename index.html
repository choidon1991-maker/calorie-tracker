<title>Daily Log</title>
<style>

  :root {
    --bg: #F6F3EC;
    --surface: #FFFDF8;
    --ink: #201F1A;
    --ink-soft: #6B675A;
    --ink-faint: #9A9586;
    --line: #201F1A;
    --line-soft: #D8D3C4;
    --accent: #3F6B63;
    --accent-ink: #FFFFFF;
    --danger: #9C4B3F;

    --cal: #A8690C;
    --pro: #8B4A5C;
    --fib: #4F7A5B;

    --radius: 2px;
    --font-label: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --font-data: ui-monospace, "SF Mono", "Menlo", "Cascadia Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181713;
      --surface: #211F1A;
      --ink: #EFEAE0;
      --ink-soft: #ABA698;
      --ink-faint: #716C5F;
      --line: #EFEAE0;
      --line-soft: #3A372E;
      --accent: #8FBBAF;
      --accent-ink: #14201D;
      --danger: #D98A7A;

      --cal: #E0A541;
      --pro: #D98C9E;
      --fib: #7FB389;
    }
  }

  :root[data-theme="dark"] {
    --bg: #181713;
    --surface: #211F1A;
    --ink: #EFEAE0;
    --ink-soft: #ABA698;
    --ink-faint: #716C5F;
    --line: #EFEAE0;
    --line-soft: #3A372E;
    --accent: #8FBBAF;
    --accent-ink: #14201D;
    --danger: #D98A7A;

    --cal: #E0A541;
    --pro: #D98C9E;
    --fib: #7FB389;
  }

  :root[data-theme="light"] {
    --bg: #F6F3EC;
    --surface: #FFFDF8;
    --ink: #201F1A;
    --ink-soft: #6B675A;
    --ink-faint: #9A9586;
    --line: #201F1A;
    --line-soft: #D8D3C4;
    --accent: #3F6B63;
    --accent-ink: #FFFFFF;
    --danger: #9C4B3F;

    --cal: #A8690C;
    --pro: #8B4A5C;
    --fib: #4F7A5B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-label);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 48px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .meal-row { transition: opacity 0.15s ease, transform 0.15s ease; }
    .add-btn:active { transform: scale(0.98); }
  }

  /* ---------- Header ---------- */

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  h1 {
    margin: 2px 0 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .today-date {
    font-family: var(--font-data);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.4;
  }

  /* ---------- Totals panel (nutrition-facts style) ---------- */

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 14px 16px 16px;
  }

  .panel-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
  }

  .panel-sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0;
  }

  .rule-thick { border: none; border-top: 5px solid var(--line); margin: 10px 0 8px; }
  .rule-mid   { border: none; border-top: 2px solid var(--line); margin: 8px 0; }
  .rule-thin  { border: none; border-top: 1px solid var(--line-soft); margin: 7px 0; }

  .cal-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .cal-label {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .cal-value {
    font-family: var(--font-data);
    font-weight: 700;
    font-size: 40px;
    font-variant-numeric: tabular-nums;
    color: var(--cal);
    line-height: 1;
  }

  .sub-nutrient {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
  }

  .sub-nutrient .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
  }

  .sub-nutrient.protein .dot { background: var(--pro); }
  .sub-nutrient.fiber .dot { background: var(--fib); }

  .sub-nutrient .name { font-weight: 600; }

  .sub-nutrient .amount {
    font-family: var(--font-data);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .sub-nutrient.protein .amount { color: var(--pro); }
  .sub-nutrient.fiber .amount { color: var(--fib); }

  .meal-count {
    margin-top: 2px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: right;
  }

  /* ---------- Add-meal form ---------- */

  form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .form-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 2px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .row3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  input, select {
    width: 100%;
    font-family: var(--font-label);
    font-size: 16px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 11px 12px;
    min-height: 44px;
  }

  input[type="number"] {
    font-family: var(--font-data);
    font-variant-numeric: tabular-nums;
  }

  input::placeholder { color: var(--ink-faint); }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  select {
    appearance: none;
    -webkit-appearance: none;
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
    background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 14px) center;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }

  select:invalid, select.is-placeholder { color: var(--ink-faint); font-weight: 400; }

  .checkbox-field {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 2px 0;
    cursor: pointer;
  }

  .checkbox-field input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 1px;
    accent-color: var(--accent);
  }

  .add-btn {
    margin-top: 4px;
    min-height: 46px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- Meal list ---------- */

  .list-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }

  .meal-list {
    display: flex;
    flex-direction: column;
  }

  .meal-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .meal-row:first-child { border-top: 1px solid var(--line-soft); }

  .meal-main {
    flex: 1;
    min-width: 0;
  }

  .meal-name {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .meal-macros {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-family: var(--font-data);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .macro-tag { display: inline-flex; align-items: baseline; gap: 4px; color: var(--ink-soft); }
  .macro-tag .dot { width: 6px; height: 6px; border-radius: 50%; }
  .macro-tag.cal .dot { background: var(--cal); }
  .macro-tag.pro .dot { background: var(--pro); }
  .macro-tag.fib .dot { background: var(--fib); }

  .delete-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid var(--line-soft);
    border-radius: 50%;
    color: var(--ink-faint);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }

  .delete-btn:hover, .delete-btn:focus-visible {
    color: var(--danger);
    border-color: var(--danger);
    outline: none;
  }

  .empty-state {
    padding: 22px 0;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
  }

  /* ---------- History (past days) ---------- */

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .day-entry {
    border: 1px solid var(--line-soft);
    background: var(--surface);
  }

  .day-entry summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 44px;
  }

  .day-entry summary::-webkit-details-marker { display: none; }
  .day-entry summary::marker { content: ""; }

  .day-summary-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .day-date {
    font-size: 14px;
    font-weight: 700;
  }

  .day-meal-count {
    font-size: 11px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .day-summary-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .day-cal {
    font-family: var(--font-data);
    font-weight: 700;
    font-size: 16px;
    color: var(--cal);
    font-variant-numeric: tabular-nums;
  }

  .chevron {
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--ink-faint);
    border-bottom: 2px solid var(--ink-faint);
    transform: rotate(-45deg);
    transition: transform 0.15s ease;
  }

  .day-entry[open] .chevron { transform: rotate(45deg); }

  .day-detail {
    padding: 2px 14px 14px;
    border-top: 1px solid var(--line-soft);
  }

  .day-detail .sub-nutrient { font-size: 13px; }

  .day-meals {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
  }

  .day-meal-row {
    padding: 8px 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .day-meal-row:last-child { border-bottom: none; }

  .day-meal-name {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 3px;
  }

</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <div class="eyebrow">Daily Log</div>
      <h1>Today's intake</h1>
    </div>
    <div class="today-date" id="todayDate"></div>
  </header>

  <section class="panel" aria-label="Daily totals">
    <p class="panel-title">Daily Total</p>
    <p class="panel-sub" id="mealCountTop">No meals logged yet</p>
    <hr class="rule-thick">
    <div class="cal-row">
      <span class="cal-label">Calories</span>
      <span class="cal-value" id="totalCalories">0</span>
    </div>
    <hr class="rule-mid">
    <div class="sub-nutrient protein">
      <span class="name"><span class="dot"></span>Protein</span>
      <span class="amount" id="totalProtein">0 g</span>
    </div>
    <hr class="rule-thin">
    <div class="sub-nutrient fiber">
      <span class="name"><span class="dot"></span>Fiber</span>
      <span class="amount" id="totalFiber">0 g</span>
    </div>
  </section>

  <form id="mealForm">
    <p class="form-title">Add a meal</p>
    <div class="field">
      <label for="templateSelect">Quick add</label>
      <select id="templateSelect">
        <option value="">Choose a saved meal…</option>
      </select>
    </div>
    <div class="field">
      <label for="mealName">Meal name</label>
      <input type="text" id="mealName" placeholder="Breakfast, lunch, snack…" list="mealSuggestions" autocomplete="off" required>
      <datalist id="mealSuggestions">
        <option value="Breakfast">
        <option value="Lunch">
        <option value="Dinner">
        <option value="Snack">
      </datalist>
    </div>
    <div class="row3">
      <div class="field">
        <label for="mealCalories">Calories</label>
        <input type="number" id="mealCalories" inputmode="numeric" min="0" step="1" placeholder="0" required>
      </div>
      <div class="field">
        <label for="mealProtein">Protein (g)</label>
        <input type="number" id="mealProtein" inputmode="decimal" min="0" step="0.1" placeholder="0" required>
      </div>
      <div class="field">
        <label for="mealFiber">Fiber (g)</label>
        <input type="number" id="mealFiber" inputmode="decimal" min="0" step="0.1" placeholder="0" required>
      </div>
    </div>
    <label class="checkbox-field">
      <input type="checkbox" id="saveTemplate">
      <span>Save these numbers as a quick-add meal</span>
    </label>
    <button type="submit" class="add-btn">Add meal</button>
  </form>

  <section aria-label="Meals logged today">
    <p class="list-title">Meals logged</p>
    <div class="meal-list" id="mealList"></div>
  </section>

  <section aria-label="Saved meals">
    <p class="list-title">Saved meals</p>
    <div class="meal-list" id="templateList"></div>
  </section>

  <section aria-label="Past days">
    <p class="list-title">Past days</p>
    <div class="history-list" id="historyList"></div>
  </section>

  <section aria-label="Weekly averages">
    <p class="list-title">Weekly averages</p>
    <div class="history-list" id="weeklyList"></div>
  </section>

</div>

<script>
(function () {
  "use strict";

  var PREFIX = "daily-log:";

  function keyForDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return PREFIX + y + "-" + m + "-" + day;
  }

  function dateFromKey(key) {
    var parts = key.slice(PREFIX.length).split("-");
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }

  var STORAGE_KEY = keyForDate(new Date());

  function loadMeals() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveMeals(meals) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(meals));
  }

  var TEMPLATES_KEY = "daily-log:templates";

  function loadTemplates() {
    try {
      var raw = localStorage.getItem(TEMPLATES_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTemplates(list) {
    localStorage.setItem(TEMPLATES_KEY, JSON.stringify(list));
  }

  var meals = loadMeals();
  var templates = loadTemplates();

  var els = {
    date: document.getElementById("todayDate"),
    totalCalories: document.getElementById("totalCalories"),
    totalProtein: document.getElementById("totalProtein"),
    totalFiber: document.getElementById("totalFiber"),
    mealCountTop: document.getElementById("mealCountTop"),
    mealList: document.getElementById("mealList"),
    historyList: document.getElementById("historyList"),
    weeklyList: document.getElementById("weeklyList"),
    templateList: document.getElementById("templateList"),
    templateSelect: document.getElementById("templateSelect"),
    form: document.getElementById("mealForm"),
    name: document.getElementById("mealName"),
    calories: document.getElementById("mealCalories"),
    protein: document.getElementById("mealProtein"),
    fiber: document.getElementById("mealFiber"),
    saveTemplate: document.getElementById("saveTemplate")
  };

  els.date.textContent = new Date().toLocaleDateString(undefined, {
    weekday: "short", month: "short", day: "numeric"
  });

  function fmtNum(n) {
    var r = Math.round(n * 10) / 10;
    return r % 1 === 0 ? String(r) : r.toFixed(1);
  }

  function computeTotals(list) {
    return list.reduce(function (acc, m) {
      acc.calories += m.calories;
      acc.protein += m.protein;
      acc.fiber += m.fiber;
      return acc;
    }, { calories: 0, protein: 0, fiber: 0 });
  }

  function macrosMarkup(m) {
    return '<span class="macro-tag cal"><span class="dot"></span>' + fmtNum(m.calories) + ' cal</span>' +
      '<span class="macro-tag pro"><span class="dot"></span>' + fmtNum(m.protein) + 'g protein</span>' +
      '<span class="macro-tag fib"><span class="dot"></span>' + fmtNum(m.fiber) + 'g fiber</span>';
  }

  function render() {
    var totals = computeTotals(meals);

    els.totalCalories.textContent = fmtNum(totals.calories);
    els.totalProtein.textContent = fmtNum(totals.protein) + " g";
    els.totalFiber.textContent = fmtNum(totals.fiber) + " g";
    els.mealCountTop.textContent = meals.length === 0
      ? "No meals logged yet"
      : meals.length + (meals.length === 1 ? " meal logged" : " meals logged");

    els.mealList.innerHTML = "";

    if (meals.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Nothing logged yet today. Add your first meal above.";
      els.mealList.appendChild(empty);
      return;
    }

    meals.forEach(function (m) {
      var row = document.createElement("div");
      row.className = "meal-row";

      var main = document.createElement("div");
      main.className = "meal-main";

      var name = document.createElement("p");
      name.className = "meal-name";
      name.textContent = m.name;

      var macros = document.createElement("div");
      macros.className = "meal-macros";
      macros.innerHTML = macrosMarkup(m);

      main.appendChild(name);
      main.appendChild(macros);

      var del = document.createElement("button");
      del.type = "button";
      del.className = "delete-btn";
      del.setAttribute("aria-label", "Delete " + m.name);
      del.textContent = "×";
      del.addEventListener("click", function () {
        meals = meals.filter(function (x) { return x.id !== m.id; });
        saveMeals(meals);
        render();
        renderWeekly();
      });

      row.appendChild(main);
      row.appendChild(del);
      els.mealList.appendChild(row);
    });
  }

  function fmtDateLabel(d) {
    var opts = { weekday: "short", month: "short", day: "numeric" };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
    return d.toLocaleDateString(undefined, opts);
  }

  function renderHistory() {
    var days = [];
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (!key || key.indexOf(PREFIX) !== 0 || key === STORAGE_KEY) continue;
      var dayMeals;
      try { dayMeals = JSON.parse(localStorage.getItem(key)) || []; } catch (e) { dayMeals = []; }
      days.push({ date: dateFromKey(key), meals: dayMeals });
    }
    days.sort(function (a, b) { return b.date - a.date; });

    els.historyList.innerHTML = "";

    if (days.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No past days yet. Come back tomorrow to see today's log here.";
      els.historyList.appendChild(empty);
      return;
    }

    days.forEach(function (day) {
      var totals = computeTotals(day.meals);

      var details = document.createElement("details");
      details.className = "day-entry";

      var summary = document.createElement("summary");
      summary.innerHTML =
        '<span class="day-summary-left">' +
          '<span class="day-date">' + fmtDateLabel(day.date) + '</span>' +
          '<span class="day-meal-count">' + day.meals.length + (day.meals.length === 1 ? ' meal' : ' meals') + '</span>' +
        '</span>' +
        '<span class="day-summary-right">' +
          '<span class="day-cal">' + fmtNum(totals.calories) + ' cal</span>' +
          '<span class="chevron"></span>' +
        '</span>';

      var detail = document.createElement("div");
      detail.className = "day-detail";

      var proRow = document.createElement("div");
      proRow.className = "sub-nutrient protein";
      proRow.innerHTML = '<span class="name"><span class="dot"></span>Protein</span><span class="amount">' + fmtNum(totals.protein) + ' g</span>';

      var fibRow = document.createElement("div");
      fibRow.className = "sub-nutrient fiber";
      fibRow.innerHTML = '<span class="name"><span class="dot"></span>Fiber</span><span class="amount">' + fmtNum(totals.fiber) + ' g</span>';

      var mealsWrap = document.createElement("div");
      mealsWrap.className = "day-meals";

      day.meals.forEach(function (m) {
        var mRow = document.createElement("div");
        mRow.className = "day-meal-row";

        var mName = document.createElement("p");
        mName.className = "day-meal-name";
        mName.textContent = m.name;

        var mMacros = document.createElement("div");
        mMacros.className = "meal-macros";
        mMacros.innerHTML = macrosMarkup(m);

        mRow.appendChild(mName);
        mRow.appendChild(mMacros);
        mealsWrap.appendChild(mRow);
      });

      detail.appendChild(proRow);
      detail.appendChild(fibRow);
      detail.appendChild(mealsWrap);

      details.appendChild(summary);
      details.appendChild(detail);
      els.historyList.appendChild(details);
    });
  }

  function startOfWeek(d) {
    var copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    copy.setDate(copy.getDate() - copy.getDay());
    return copy;
  }

  function fmtWeekLabel(start) {
    var end = new Date(start);
    end.setDate(end.getDate() + 6);
    var thisYear = new Date().getFullYear();
    var optsStart = { month: "short", day: "numeric" };
    var optsEnd = { month: "short", day: "numeric" };
    if (start.getFullYear() !== thisYear || end.getFullYear() !== thisYear) optsEnd.year = "numeric";
    return start.toLocaleDateString(undefined, optsStart) + " – " + end.toLocaleDateString(undefined, optsEnd);
  }

  function renderWeekly() {
    var weeksByStart = {};

    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (!key || key.indexOf(PREFIX) !== 0) continue;
      var dayMeals;
      try { dayMeals = JSON.parse(localStorage.getItem(key)) || []; } catch (e) { dayMeals = []; }
      if (dayMeals.length === 0) continue;

      var date = dateFromKey(key);
      var ws = startOfWeek(date);
      var wsKey = ws.getTime();
      if (!weeksByStart[wsKey]) weeksByStart[wsKey] = { start: ws, days: [] };
      weeksByStart[wsKey].days.push({ date: date, meals: dayMeals });
    }

    var weeks = Object.keys(weeksByStart).map(function (k) { return weeksByStart[k]; });
    weeks.sort(function (a, b) { return b.start - a.start; });

    els.weeklyList.innerHTML = "";

    if (weeks.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No weekly data yet. Log a few days to see your weekly averages.";
      els.weeklyList.appendChild(empty);
      return;
    }

    weeks.forEach(function (week) {
      week.days.sort(function (a, b) { return a.date - b.date; });

      var weekTotals = { calories: 0, protein: 0, fiber: 0 };
      week.days.forEach(function (day) {
        var t = computeTotals(day.meals);
        weekTotals.calories += t.calories;
        weekTotals.protein += t.protein;
        weekTotals.fiber += t.fiber;
      });

      var n = week.days.length;
      var avg = { calories: weekTotals.calories / n, protein: weekTotals.protein / n, fiber: weekTotals.fiber / n };

      var details = document.createElement("details");
      details.className = "day-entry";

      var summary = document.createElement("summary");
      summary.innerHTML =
        '<span class="day-summary-left">' +
          '<span class="day-date">' + fmtWeekLabel(week.start) + '</span>' +
          '<span class="day-meal-count">' + n + (n === 1 ? ' day logged' : ' days logged') + '</span>' +
        '</span>' +
        '<span class="day-summary-right">' +
          '<span class="day-cal">' + fmtNum(avg.calories) + ' cal/day</span>' +
          '<span class="chevron"></span>' +
        '</span>';

      var detail = document.createElement("div");
      detail.className = "day-detail";

      var proRow = document.createElement("div");
      proRow.className = "sub-nutrient protein";
      proRow.innerHTML = '<span class="name"><span class="dot"></span>Avg. protein</span><span class="amount">' + fmtNum(avg.protein) + ' g/day</span>';

      var fibRow = document.createElement("div");
      fibRow.className = "sub-nutrient fiber";
      fibRow.innerHTML = '<span class="name"><span class="dot"></span>Avg. fiber</span><span class="amount">' + fmtNum(avg.fiber) + ' g/day</span>';

      var daysWrap = document.createElement("div");
      daysWrap.className = "day-meals";

      week.days.forEach(function (day) {
        var dayTotals = computeTotals(day.meals);

        var dRow = document.createElement("div");
        dRow.className = "day-meal-row";

        var dName = document.createElement("p");
        dName.className = "day-meal-name";
        dName.textContent = day.date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

        var dMacros = document.createElement("div");
        dMacros.className = "meal-macros";
        dMacros.innerHTML = macrosMarkup(dayTotals);

        dRow.appendChild(dName);
        dRow.appendChild(dMacros);
        daysWrap.appendChild(dRow);
      });

      detail.appendChild(proRow);
      detail.appendChild(fibRow);
      detail.appendChild(daysWrap);

      details.appendChild(summary);
      details.appendChild(detail);
      els.weeklyList.appendChild(details);
    });
  }

  function renderTemplateSelect() {
    var current = els.templateSelect.value;
    els.templateSelect.innerHTML = '<option value="">Choose a saved meal…</option>';

    templates
      .slice()
      .sort(function (a, b) { return a.name.localeCompare(b.name); })
      .forEach(function (t) {
        var opt = document.createElement("option");
        opt.value = t.id;
        opt.textContent = t.name + " (" + fmtNum(t.calories) + " cal)";
        els.templateSelect.appendChild(opt);
      });

    els.templateSelect.value = templates.some(function (t) { return t.id === current; }) ? current : "";
    els.templateSelect.classList.toggle("is-placeholder", !els.templateSelect.value);
  }

  function renderTemplateList() {
    els.templateList.innerHTML = "";

    if (templates.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No saved meals yet. Check “Save these numbers as a quick-add meal” when logging one to build your list.";
      els.templateList.appendChild(empty);
      return;
    }

    templates
      .slice()
      .sort(function (a, b) { return a.name.localeCompare(b.name); })
      .forEach(function (t) {
        var row = document.createElement("div");
        row.className = "meal-row";

        var main = document.createElement("div");
        main.className = "meal-main";

        var name = document.createElement("p");
        name.className = "meal-name";
        name.textContent = t.name;

        var macros = document.createElement("div");
        macros.className = "meal-macros";
        macros.innerHTML = macrosMarkup(t);

        main.appendChild(name);
        main.appendChild(macros);

        var del = document.createElement("button");
        del.type = "button";
        del.className = "delete-btn";
        del.setAttribute("aria-label", "Delete saved meal " + t.name);
        del.textContent = "×";
        del.addEventListener("click", function () {
          templates = templates.filter(function (x) { return x.id !== t.id; });
          saveTemplates(templates);
          renderTemplateSelect();
          renderTemplateList();
        });

        row.appendChild(main);
        row.appendChild(del);
        els.templateList.appendChild(row);
      });
  }

  function upsertTemplate(name, calories, protein, fiber) {
    var existing = templates.find(function (t) { return t.name.toLowerCase() === name.toLowerCase(); });
    if (existing) {
      existing.calories = calories;
      existing.protein = protein;
      existing.fiber = fiber;
    } else {
      templates.push({
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
        name: name,
        calories: calories,
        protein: protein,
        fiber: fiber
      });
    }
    saveTemplates(templates);
  }

  els.templateSelect.addEventListener("change", function () {
    var t = templates.find(function (x) { return x.id === els.templateSelect.value; });
    els.templateSelect.classList.toggle("is-placeholder", !els.templateSelect.value);
    if (!t) return;

    els.name.value = t.name;
    els.calories.value = t.calories;
    els.protein.value = t.protein;
    els.fiber.value = t.fiber;
    els.templateSelect.value = "";
    els.templateSelect.classList.add("is-placeholder");
  });

  els.form.addEventListener("submit", function (e) {
    e.preventDefault();

    var name = els.name.value.trim();
    var calories = parseFloat(els.calories.value);
    var protein = parseFloat(els.protein.value);
    var fiber = parseFloat(els.fiber.value);

    if (!name || isNaN(calories) || isNaN(protein) || isNaN(fiber)) return;

    meals.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      name: name,
      calories: calories,
      protein: protein,
      fiber: fiber
    });

    saveMeals(meals);

    if (els.saveTemplate.checked) {
      upsertTemplate(name, calories, protein, fiber);
      renderTemplateSelect();
      renderTemplateList();
    }

    render();
    renderWeekly();

    els.form.reset();
    els.templateSelect.classList.add("is-placeholder");
    els.name.focus();
  });

  render();
  renderHistory();
  renderWeekly();
  renderTemplateSelect();
  renderTemplateList();
})();
</script>
</body>
</html>
